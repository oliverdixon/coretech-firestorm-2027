name: Build and Test FIRE STORM

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'coretech/**'
      - '.github/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'

concurrency:
  group: deploy-firestorm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-firestorm:
    runs-on: [ linux ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Configure tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake -G Ninja --preset debug-tests
          cmake -G Ninja --preset release-tests

      - name: Build tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake --build cmake-build-debug-tests
          cmake --build cmake-build-release-tests

      - name: Run debug tests
        shell: bash
        run: |
          set -Eeuo pipefail
          ctest --test-dir cmake-build-debug-tests --output-on-failure

      - name: Run release tests
        shell: bash
        run: |
          set -Eeuo pipefail
          ctest --test-dir cmake-build-release-tests --output-on-failure
